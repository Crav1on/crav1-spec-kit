  stage: stable
  walkthrough: docs/from-review-pr.md
  purpose: Read one named open pull request and report whether it can ship.
  in_depth:
  - When an open pull request is named, **`/crav1-review-pr`** reads the diff and says whether it can
    ship. It is cross-cutting. It is not a lane and not a bot. A pull request with a plan keeps the plan
    and `verify.md` checks. A pull request with no `plan.md` or `tasks.md` for its slug was built outside
    the kit. That is an info note. It does not report a missing `verify.md`. It reads the test results
    that pull request's own pipeline already recorded. It does not run the tests, and it does not ask
    to. It ends by naming `/crav1-keep-current` after the merge and does not run it. It ends with a
    paste-ready Markdown comment in your own friendly first-person voice, with a varied opening, the
    sections Blocker, Bugs, and Tests to add with this PR, a link to each file in the pull request files
    view and per-line remarks, and no tool or kit names. Follow-ups, including choices the description
    calls deliberate, are not posted and not in that comment; the chat lists them and they are saved as
    `docs/notes/review-pr-<n>-follow-ups.md` (PR, repo, date, each with its file and line), which a
    re-review updates and `/crav1-feature-candidates` reads as an open note. No follow-ups, no note. Re-review replies use the
    same voice. After your yes it posts each finding as an inline comment on its line and a summary without
    the verdict, then asks which verdict to set. A re-review reads the earlier findings from the pull
    request's own threads and marks each fixed (with the commit), partly fixed, still open, or no longer
    relevant. It never resolves a thread without your yes. It does not edit or merge. `/crav1-open-pr` may name it and does not run it. `/crav1-merge-pr` does
    not run it. Spark, specify, and verify do not run it.
  - Reads one named open pull request. When the slug has `plan.md`, spec, plan, `verify.md`, the body,
    and a required green linter must hold before it says ship. When the slug has no `plan.md` or `tasks.md`,
    that is an info note. It does not report a missing `verify.md`. It reviews spec fit, the body, the
    required green linter, and secrets, and it reads the pipeline's recorded tests. It does not run tests.
    It names `/crav1-keep-current` after that pull request merges and does not run it. Names the lane
    for a finding and does not start it. Posts comments and a verdict only after the user's yes. Does
    not edit, install a linter, or merge. Spark,
    specify, and verify do not run it.
  use_when: This turn names an open pull request
  table:
    reads: The pull request, its diff, and the spec
    writes: A follow-ups note in `docs/notes/` when there are follow-ups
