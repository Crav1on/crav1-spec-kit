    is shape and connections only, after the same yes or no as `/crav1-environment-read`. It never reads
    data. A failed live read is one prompt, Retry or Skip. Skip is the repo-only answer. A focus still
    runs the full read and shows only those sections. It writes nothing. It may name one skill. It does
    not run another skill. It is cross-cutting. It may run from any lane. It does not move work into a
    lane. It is a later skill. It is not a starter option. Asking for startup options names only the seven
