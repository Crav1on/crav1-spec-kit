  - '**`/crav1-tasks-ready-to-build`** reads `spec.md` open questions, `plan.md` (the `Reviewed:` line and `## Risks`), `tasks.md`, and `verify.md` for one slice or every slice. A ticked task is Done when `verify.md` lists it as verified, otherwise Needs verify. Then a task is blocked by a missing `plan.md`, by a kept-open question whose `Blocks:` line names it, by a kept-open question or plan Risk with no `Blocks:` line (the whole slice, inferred), or by an unticked task in its `(after: T#)` (recorded) or, with no `(after: …)`, any earlier unticked task (inferred). Otherwise it is Ready, with a warning when the plan review is unknown (inferred) or still has open `P#`s.'
  - 'Shows summary counts per slice, then Ready, Blocked (one reason each, recorded or inferred), Needs verify, a Done count, `Next: /crav1-implement-task T#`, and a `Source:` line. Local only: it never reads Azure Boards and names `/crav1-ado-to-tasks` for task states there. It writes nothing and runs no other skill. It can run any time. It is cross-cutting. It is not a starter option.'
  use_when: 'You want to know which tasks can be built now, and why the others cannot'
  table:
    reads: '`spec.md` open questions, `plan.md`, `tasks.md`, and `verify.md` per slice'
    writes: Nothing (a list in chat with its source)
  reads: 'Reads, for one slice or every slice under `docs/specs/`, the open questions in `spec.md` with their `Blocks:`, `Asked:`, `Pending:`, and `Answered:` lines, the `Reviewed:` line and `## Risks` in `plan.md`, the task lines in `tasks.md` with their ticks and `(after: T#)`, and `verify.md` when it exists.'
  writes: 'Writes a list in the chat with summary counts, Ready, Blocked, Needs verify, a Done count, the next step, and its source.'
  leaves_alone: 'Leaves every file alone, and never reads Azure Boards.'
  exceptions: 'does not guess a dependency or a blocking link from task text. Where nothing is recorded it uses a fallback and marks the reason inferred. It writes no marks; review-plan, tighten-plan, plan-from-spec, and resolve-questions write them.'
  called_by: Called by the user, any time.
  runs_by_itself: Calls no skill.
  you_run_next:
