# The one written source for the order of kit commands.
#
# scripts/gen-workflow.py reads this file and writes:
#   - docs/reference/workflow.md            (the routes, one section per route)
#   - the order block in .cursor/rules/crav1.mdc (between the crav1-order markers)
#   - every `you_run_next` value in docs/reference/skills.yaml
# Then run scripts/gen-skill-docs.py and scripts/sync-crav1-plugin.sh.
# `scripts/gen-workflow.py --check` fails CI when any of those drift.
#
# Route step fields:
#   skills     one or more skills; more than one means "one of these"
#   when       when the step applies, in plain words
#   optional   true when the step can be skipped; the step before it then
#              names both this step and the next required one
#   loop_to    after this step, go back to that skill (no other next step)
#   then       per skill in the step: its own next steps, instead of the route's
#   as_next    how the step is written when another skill names it as next
#
# A skill's `you_run_next` is: every next step the routes give it (in route
# order), then its `also_next` entries. `override` replaces both.

routes:
  - id: new-slice
    title: New slice
    when: You are starting a new feature from one or two sentences, a pile of ideas, or several files.
    steps:
      - skills: [crav1-spark-to-spec, crav1-ideas-to-spec, crav1-intake-to-specs]
        when: One or two sentences (spark), a pile of ideas and technical hunches (ideas), or mixed files or several v0 features (intake, then each slice follows this route).
      - skills: [crav1-feature-branch]
        optional: true
        when: Before the first commit for the slice, on `feat/<slug>` (or `spec/<slug>` for specify only).
      - skills: [crav1-architecture-reviewer]
        optional: true
        when: When the spec touches structure, data, or integrations.
      - skills: [crav1-tighten-spec]
        when: Always, before questions and the plan.
      - skills: [crav1-resolve-questions]
        when: When `## Open questions` still has items.
      - skills: [crav1-specs-to-ado]
        optional: true
        when: When the team tracks Features in Azure Boards.
      - skills: [crav1-plan-from-spec]
        when: The spec is tight and its questions are answered or kept open on purpose.
      - skills: [crav1-review-plan]
        when: Right after the plan is written.
      - skills: [crav1-tighten-plan]
        when: After the plan review.
      - skills: [crav1-tasks-to-ado]
        optional: true
        when: When the Feature is in Azure Boards and the tasks should be too.
      - skills: [crav1-tasks-ready-to-build]
        optional: true
        when: Any time, to see which tasks are ready, which are blocked and why. Read-only.
      - skills: [crav1-implement-task, crav1-complete-task, crav1-complete-tasks, crav1-complete-features]
        when: "One task in this chat (implement-task), or a worker per task (complete-task, complete-tasks, complete-features). The complete skills implement, commit, and verify each task inside their worker, so they go straight to the pull request."
        then:
          crav1-complete-task: [crav1-open-pr]
          crav1-complete-tasks: [crav1-open-pr]
          crav1-complete-features: [crav1-open-pr]
      - skills: [crav1-verify-spec]
        when: After implement-task, against the spec and the plan.
      - skills: [crav1-fix-from-verify, crav1-fix-live]
        optional: true
        loop_to: crav1-verify-spec
        when: When `verify.md` has a failure (fix-from-verify), or to fix it against the running host (fix-live). Do not edit `spec.md` in this loop.
      - skills: [crav1-draft-commit-message]
        optional: true
        when: When you want to see the commit message before the commit.
      - skills: [crav1-finalize-commit]
        when: When the slice verifies.
      - skills: [crav1-open-pr]
        when: To push and open the pull request.
      - skills: [crav1-review-pr]
        when: Before the merge.
      - skills: [crav1-merge-pr]
        when: When the review says ship and the host checks are green.

  - id: new-info
    title: New information on an existing slice
    when: Minutes, a mail, a chat, or a new fact changes a spec that already exists, built or not.
    steps:
      - skills: [crav1-meeting-to-specs, crav1-add-to-spec]
        when: Minutes, a transcript, a mail, or a chat (meeting-to-specs), or one new fact (add-to-spec).
      - skills: [crav1-tighten-spec]
        when: Always, on each spec that changed. New text needs the same tightening as the first draft.
      - skills: [crav1-resolve-questions]
        when: When the change added or answered open questions. Use `/crav1-ask-open-questions` for the ones someone else must answer.
      - skills: [crav1-plan-from-spec]
        when: When the slice has `plan.md` or `tasks.md`, so the plan and the tasks follow the new spec.
      - skills: [crav1-specs-to-ado]
        optional: true
        when: Only when the Feature itself changed and it is in Azure Boards.
      - skills: [crav1-tasks-to-ado]
        optional: true
        when: When the tasks are in Azure Boards.
      - skills: [crav1-tasks-ready-to-build]
        optional: true
        when: Any time, to see which tasks are ready after the change, which are blocked and why. Read-only.
      - skills: [crav1-complete-tasks, crav1-complete-task, crav1-implement-task]
        when: To build the tasks that are not built yet. The complete skills verify each task inside their worker.
        then:
          crav1-complete-task: [crav1-open-pr]
          crav1-complete-tasks: [crav1-open-pr]
      - skills: [crav1-verify-spec]
        when: After implement-task, or for the whole slice when you want one report.
      - skills: [crav1-finalize-commit]
        when: When the slice verifies.

  - id: bug
    title: Bug
    when: Someone names a real bug.
    steps:
      - skills: [crav1-fix-bug]
        when: The bug is named. It says which lane the fix belongs to.
      - skills: [crav1-tighten-spec, crav1-plan-from-spec, crav1-implement-task]
        when: The lane fix-bug named. Spec miss is Specify (tighten-spec), plan miss is Plan (plan-from-spec), code miss is Build (implement-task). Tighten-spec and plan-from-spec then follow the New slice route from that step.
        then:
          crav1-tighten-spec: []
          crav1-plan-from-spec: []
      - skills: [crav1-verify-spec]
        when: After the fix is built.
      - skills: [crav1-fix-from-verify]
        optional: true
        loop_to: crav1-verify-spec
        when: When `verify.md` has a failure.
      - skills: [crav1-finalize-commit]
        when: When it verifies.
      - skills: [crav1-open-pr]
        when: To push and open the pull request.

  - id: outside-pr
    title: Outside pull request
    when: A pull request was built outside the kit (its slug has no `plan.md` or `tasks.md`).
    steps:
      - skills: [crav1-review-pr]
        when: The pull request is open.
      - skills: [crav1-merge-pr]
        when: When the review says ship.
      - skills: [crav1-keep-current]
        as_next: /crav1-keep-current after an outside pull request merges
        when: After the merge, to bring its changes into the spec and `docs/system/`.
      - skills: [crav1-finalize-commit]
        when: When keep-current changed a file.

  - id: ado-sync
    title: Azure Boards sync
    when: Specs and Azure Boards (ADO) should match.
    steps:
      - skills: [crav1-feature-candidates]
        when: To see which specs and notes could become Features.
      - skills: [crav1-specs-to-ado]
        when: To create or update the Features.
      - skills: [crav1-tasks-to-ado]
        when: When the slice has `tasks.md`.
      - skills: [crav1-ado-to-tasks]
        when: To read task states back from Azure Boards.

# Extra next steps after the route steps (side steps such as a commit).
also_next:
  crav1-intake-to-specs: [/crav1-finalize-commit]
  crav1-match-to-specs: [/crav1-finalize-commit]
  crav1-repos-to-spec: [/crav1-finalize-commit]
  crav1-environment-read: [/crav1-finalize-commit]
  crav1-feature-branch: [/crav1-finalize-commit]
  crav1-ask-open-questions: [/crav1-meeting-to-specs, /crav1-match-dump-to-specs, /crav1-finalize-commit]
  crav1-meeting-to-specs: [/crav1-finalize-commit]
  crav1-add-to-spec: [/crav1-finalize-commit]
  crav1-match-dump-to-specs: [/crav1-finalize-commit]
  crav1-code-into-specs: [/crav1-finalize-commit]
  crav1-draft-commit-message: [/crav1-finalize-commit]
  crav1-review-pr: [/crav1-keep-current after an outside pull request merges]
  crav1-explain: [/crav1-whats-known-about]
  crav1-keep-current: [/crav1-finalize-commit]
  crav1-pipeline-environments: [/crav1-environment-read]
  crav1-security-review: [/crav1-finalize-commit]
  crav1-specs-to-ado: [/crav1-finalize-commit]
  crav1-tasks-to-ado: [/crav1-finalize-commit]
  crav1-ado-to-tasks: [/crav1-finalize-commit]
  crav1-ado-to-specs: [/crav1-finalize-commit]
  crav1-exploratory-test: [/crav1-finalize-commit]
  crav1-suggest-tests-for-code: [/crav1-plan-from-spec]

# Replaces the generated list. Free text is allowed here only.
override:
  crav1-fix-bug: ["The lane it names (Specify, Plan, or Build)"]
  crav1-whats-known-about: ["The one skill it names, if any"]
  crav1-export-spec: []
  crav1-help: [The skill or route step it names]
  crav1-tasks-ready-to-build: [/crav1-implement-task]
