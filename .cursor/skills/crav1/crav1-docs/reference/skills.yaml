  - '**`/crav1-retire-spec`** takes one spec out of the work. It opens with one question: retire (Recommended),
    merge, park, or convert to note, and skips it when the wording answers. A headless or bot run with
    no choice word stops and lists the words. It always shows a summary of every change and waits for
    a yes. It never deletes; a moved spec leaves a one-line `Moved:` pointer at its old path. Retire moves
    the spec to `docs/specs/retired/` with a `Retired:` line, removes its feature-index row, and flags
    links to it. Merge takes a named target or suggests only real fits with a reason each (shared feature
    area, overlapping requirements, same system in landscape, links), best first, or says `no good merge
    fit found`; content, open questions, and decisions move over credited `(from <slug>)`. Park adds a
    `Parked:` line in place; plan, build, and ado-sync push skip it, and add-to-spec saves matching input
    as one note waiting for it. Un-park re-reads each waiting note in full and adds the spec to `Used by`.
    Convert to note writes `docs/notes/YYYY-MM/` with a `Source:` line and a landscape line, and regenerates the notes index.'
