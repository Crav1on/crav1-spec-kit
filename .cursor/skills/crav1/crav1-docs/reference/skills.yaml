  in_depth:
  - File-level `plan.md` and `tasks.md`; each verify note names the checks before code; names a linter
    or checker when the repo has one, and stops before Build when it does not; refuses to code and does
    not install a linter. When the spec is partial or `## In the code` names paths, reads that repo and
    branch and chooses finish the gap, add a verify test, or leave it before any task. A piece that already
    matches v0 is not a choice.
  - '1.64.0: Built pieces reads every work branch of the spec without checkout (and `../<repo>` for another repo), labels pieces `only on <branch>, not merged`, and ends a task with `(branch: …)` when its piece lives on one branch.'
  use_when: Spec is accepted
  table:
    reads: Spec, diagrams, ADRs; the named repo and branch when the slice is partial
    writes: '`plan.md`, `tasks.md`, and matching OpenSpec export files when those already exist'
  reads: Reads the accepted spec, diagrams, ADRs, exports, kept security findings already written, and,
    when the spec is partial or `## In the code` names paths, that same committed repo and branch before
    any task is written.
  writes: Writes `plan.md` and `tasks.md`, and matching OpenSpec export files when those already exist.
    A built piece that already matches v0 is marked already there and gets no rebuild task. A piece the
    user leaves gets one line in the plan and no task. Lists stale research findings under Risks. That
