    - word: "push features"
      means: "push Features"
    - word: "push tasks"
      means: "push tasks"
    - word: "pull tasks"
      means: "pull tasks"
    - word: "pull spec changes"
      means: "pull spec changes"
  lane: cross-cutting
  group: Azure Boards
  starter: false
  since: 1.31.0
  stage: stable
  walkthrough: docs/from-ado-sync-suggest-features.md
  purpose: Keep specs and Azure Boards in step; asks suggest Features, push Features, push tasks, pull
    tasks, or pull spec changes.
  in_depth:
  - '**`/crav1-ado-sync`** opens with one question: suggest Features (read only), push Features, push
    tasks, pull task changes, or pull spec changes from Features. It skips the question when the message
    says which. Every write to Azure Boards still needs a yes. It replaces feature-candidates, specs-to-ado,
    tasks-to-ado, ado-to-tasks, and ado-to-specs; their rules are kept as branches.'
  - 'Suggest Features (was `/crav1-feature-candidates`): Lists Feature candidates from the landscape,
    the specs, research, sources, and open notes. Writes nothing unless the user asks for a file.'
  - 'Suggest Features (was `/crav1-feature-candidates`): Titles say what the work is, for example ''Orders API: retry on timeout''. Each candidate has the same labelled lines (Target date (with
    its source), Spec, Description, Open blockers/questions as bullets with who and when where the docs
    say, and Order/priority). Descriptions are full paragraphs with context, who does what, related task-list
    items, and quotes with names and dates, and nothing the docs do not state.'
  - 'Push Features (was `/crav1-specs-to-ado`): Sends picked candidates to Azure Boards as Features after
    a yes, then writes the id onto the spec.'
  - 'Push Features (was `/crav1-specs-to-ado`): Before the preview it strips spec paths, `docs/sources/`
    folders, and spec references from the candidate text, so nothing sent to Azure Boards points at the
    specs repo.'
  - 'Push Features (was `/crav1-specs-to-ado`): Each implementation repo has its own work item home, the
    `Work items go to` column in `docs/system/repos.md` (`ADO: <org>/<project>`), asked once per repo
    the first time and written only after the answer. A spec whose repos are in several homes gets one
    Feature in each, previewed and sent on its own yes, linked in the same org or mentioned in plain text
    across orgs. Id lines end with `(ADO: <org>/<project>)`.'
  - 'Push tasks (was `/crav1-tasks-to-ado`): Pick one spec that already has a Feature id in `work-item.md`.
    Every task in its `tasks.md` is listed, numbered, and you pick by number or all. The child work item
    type is asked once and saved as a line in `docs/environments/marks.md`, with the type''s done state
    (Closed on Agile, Done on Scrum and Basic); edit a line to change it. The question marks the type
    on the requirement backlog level directly under Feature as recommended (User Story on Agile, Product
    Backlog Item on Scrum, Issue on Basic, Requirement on CMMI), and gives none when the levels cannot
    be read.'
  - 'Push tasks (was `/crav1-tasks-to-ado`): Each task is previewed as a child of the Feature: a fuller
    title that says what the work is, State New (or the done state when the box is ticked), Iteration
    and Priority blank, tags for the slice and the code repos, the owner when the docs state one, a fuller
    description (what, why, who, decisions with quotes, names, and dates, related items, open blockers
    or none recorded), and the task''s verify line as acceptance. File paths, line numbers, spec references,
    and kit names are stripped; code repo names stay; the specs repo is never mentioned.'
  - 'Push tasks (was `/crav1-tasks-to-ado`): On an update, a box ticked since the item was sent offers
    moving it to the done state, and an unticked box on a closed item offers a reopen to New, each only
    on a yes. A disagreement the `tasks.md` history does not explain shows both sides and asks each time.
    The kit never sets Active or Resolved and never sends Reason.'
  - 'Push tasks (was `/crav1-tasks-to-ado`): Each task goes to its repo''s work item home and its parent
    is the Feature in that home. A task with no clear repo, or with repos in different homes, is asked
    about. The child type and done state are saved per home in `docs/environments/marks.md`.'
  - 'Pull tasks (was `/crav1-ado-to-tasks`): Pick a spec with task lines in `work-item.md`, or all. Every
    recorded task item is read back (State, title, description, acceptance, Assigned To, comments, history)
    and only what differs from the spec and `tasks.md` is shown, plus child items under the Feature that
    no task line records.'
  - 'Pull tasks (was `/crav1-ado-to-tasks`): Each difference is kept or dismissed, fresh every run. Kept
    changes go in through `/crav1-add-to-spec`. A task in the done state in Azure Boards ticks its box
    only on your yes; one reopened there unticks a ticked box only on your yes. Each id is read in its
    own work item home; one not found is reported as moved or missing. A new child is added as a task,
    with its id recorded in `work-item.md`, only on your yes. It never writes a field back; a reply comment
    is stripped and posted only on yes.'
  - 'Pull spec changes (was `/crav1-ado-to-specs`): Reads Azure Boards Features back and shows what differs.
    A kept change goes through `/crav1-add-to-spec`. A reply comment is posted only after a yes.'
  - 'Pull spec changes (was `/crav1-ado-to-specs`): Each id is read in its own work item home. An id not
    found there is reported as moved or missing, and it asks before searching other projects.'
  use_when: Specs and Azure Boards should match
  table:
    reads: 'Suggest Features: The landscape, the specs, research, and sources; Push Features: The org,
      the project, and the candidate list; Push tasks: The org, the project, the spec''s Feature id, and
      its `tasks.md`; Pull tasks: The task items a spec records, and the Feature''s children; Pull spec
      changes: Recorded Feature ids, or the ids named'
    writes: 'Suggest Features: Nothing unless the user asks for a file; Push Features: A Feature in Azure
      Boards after a yes, then its id in that spec''s `work-item.md` or a landscape "No spec yet in ADO"
      row; Push tasks: Child work items in Azure Boards after a yes, then task lines in that spec''s `work-item.md`;
      Pull tasks: Kept changes through `/crav1-add-to-spec`; a comment in Azure Boards after a yes; Pull
      spec changes: Nothing itself. A reply comment in Azure Boards only after a yes. Kept changes and
      answers go to the spec through `/crav1-add-to-spec`'
  reads: 'Suggest Features: Reads `docs/system/landscape.md` (the spec index, Ideas, Way of working, and
    code with no slice), `docs/system/repos.md`, the glossary, every `docs/specs/*/spec.md` (milestones,
    slices, open questions, and actions), `plan.md`, `tasks.md`, and `verify.md` where present, `docs/research/`
    and `docs/sources/` with each fact labelled by its source, a stale research note shown as stale, open
    notes in `docs/notes/` labelled as notes and not as candidates by themselves, each spec’s `work-item.md`,
    and the landscape “No spec yet in ADO” table. Push Features: Reads the org and project from `docs/environments/marks.md`
    or Azure DevOps URLs in `docs/system/repos.md`, checks `az` including the default install paths, checks
    that the project has the Feature work item type, reads the Feature fields before the preview, and
    reads the candidate list. When the type has Acceptance Criteria, the checks go there. When it does
    not, the checks go in the Description as an Acceptance checks list and that field is not sent. Push
    tasks: Reads the org and project from `docs/environments/marks.md` or Azure DevOps URLs in `docs/system/repos.md`,
    checks `az` the same way as `/crav1-ado-sync`, reads the Feature id from `work-item.md`, every task
    in `tasks.md`, the saved child type line, the project''s work item types on the first run, and the
    child type''s fields. Pull tasks: Reads the org and project the same way as `/crav1-ado-sync`, the
    task lines and the Feature line in `work-item.md`, every recorded task item with its comments and
    history, the child type''s fields, and the Feature''s children. Pull spec changes: Reads the ids in
    every `work-item.md` and the landscape “No spec yet in ADO” table, or only the ids the user names,
    then State, Priority, Target Date, Iteration, Assigned To, discussion comments, and history. It reads
    the checks from Acceptance Criteria when the Feature type has that field, and from the Acceptance
    checks list in the Description when it does not, so a match is not a change. Comments use api version
    `7.1-preview`, which `az devops invoke` can parse.'
  writes: 'Suggest Features: Writes nothing unless the user asks for a file. Push Features: Writes a Feature
    only after the user says yes. After a Create, writing the new id into that spec’s `work-item.md` with
    its milestone or slice label, or a row on the landscape “No spec yet in ADO” table when the item has
    no spec, is required. Push tasks: Writes a child work item only after the user says yes, linked to
    the Feature as its parent. After a Create, appends `Work item: <id> — task: T<n> <short title>` to
    `work-item.md` (required). On the first run, appends the child type line and the done-state line to
    `docs/environments/marks.md`. Pull tasks: Writes the spec and `tasks.md` only through `/crav1-add-to-spec`
    for kept changes, ticks a box or adds a task only after a yes, appends a task line to `work-item.md`
    for an added task, and posts a reply comment only after a yes. Pull spec changes: Writes nothing itself.
    A kept change and an answer the user gives go to the spec through `/crav1-add-to-spec`. A reply comment
    is posted only after the user says yes.'
  leaves_alone: 'Suggest Features: Leaves specs, Azure Boards, and commits alone. Push Features: Leaves
    the preview unedited, Iteration and Priority blank, and the specs repo out of anything sent. Push
    tasks: Leaves `tasks.md` without ids, the preview unedited, Iteration, Priority, and Reason unsent,
    Active to people, and the specs repo out of anything sent. Pull tasks: Leaves every Azure Boards field,
    `tasks.md` ids, and dismissed changes alone. Pull spec changes: Leaves a missing id unmatched.'
  exceptions: 'Suggest Features: a dated milestone or slice is one candidate. An undated spec with open
    work is one candidate. A spec that holds only open questions is marked questions only. An item with
    no spec is marked no spec yet. Done or retired with nothing open is skipped. A target date is given
    only when the docs state it. It does not start Specify, Plan, or Build. It is not a starter option.
    Push Features: a missing Feature type stops. An `az` failure, including a failed field read, states
    the issue, suggests a fix such as `az login`, and offers a skip. It does not guess. It does not show
    the `az` command. It does not install or log in. The closing output names the file written, says it
    is not committed yet, names `/crav1-finalize-commit`, and says a later run would offer Create again.
    If the write fails, it prints the line to add. It does not start Specify, Plan, or Build. It is not
    a starter option. Push tasks: a spec with no Feature id is not offered and names `/crav1-ado-sync`.
    A re-run offers Update for a recorded task and shows only changed fields. Edits go into the spec first
    through `/crav1-add-to-spec`. An `az` failure states the issue, suggests a fix, and offers a skip.
    It does not commit. It is not a starter option. Pull tasks: a spec with no task lines names `/crav1-ado-sync`.
    A missing id is reported as missing, not guessed. Dismiss is for this run only. It does not commit.
    It is not a starter option. Pull spec changes: dismissals start fresh each run. A no-spec-yet Feature
    names a starter such as `/crav1-spark-to-spec` and does not run it. When the spec has no answer, no
    reply is drafted and the question is offered as an open question. An `az` failure, including a failed
    field read, is handled the same way as `/crav1-ado-sync`. It does not start Specify, Plan, or Build.
    It is not a starter option.'
  called_by: Called by the user and by `/crav1-ado-sync`.
  runs_by_itself: 'Suggest Features: Calls no skill. Push Features: Calls `/crav1-ado-sync`, and `/crav1-add-to-spec`
    when a preview change belongs in the spec. Push tasks: Calls `/crav1-add-to-spec` when a preview change
    belongs in the spec. Pull tasks: Calls `/crav1-add-to-spec` for each kept change. Pull spec changes:
    Calls `/crav1-add-to-spec` for one kept change and for one answer.'
  you_run_next:
  - /crav1-plan-from-spec
  - /crav1-tasks-ready-to-build
  - /crav1-build-tasks
  - /crav1-build-features
  - /crav1-finalize-commit
  first_prompt: /crav1-ado-sync
- name: crav1-run-exploratory-test
  lane: cross-cutting
  group: Testing helpers
  starter: false
  since: 1.16.0
  stage: stable
  walkthrough: docs/from-run-exploratory-test.md
  purpose: After a build of a slice already exists, use the slice in two passes and write down bugs.
  in_depth:
  - When a build of a slice already exists, **`/crav1-run-exploratory-test`** uses that slice in two passes
    and writes down bugs. Pass one learns the slice by using it once. Pass two is no longer careful. It
    adds randomness and follows what the last action showed. It lasts about as long as the first pass,
    long enough to provoke bugs, then it stops. That stop is named `matched the first pass`. It stops
    sooner when the user says stop. That stop is named `the user said stop`. The user does not set a clock.
    It writes `docs/specs/<slug>/explore.md`. It does not write the checks the plan already named. It
    is cross-cutting. It may run from any lane. It does not move work into Specify, Plan, or Build. A
    bug it finds is not sent to `/crav1-fix-bug` unless the user says so in that turn. It is a later skill.
    It is not a starter option. Asking for startup options names only the six and does not run this
    command.
  - After a build of a slice already exists, uses the slice once, then again with randomness, and writes
    bugs to `docs/specs/<slug>/explore.md`. The second pass lasts about as long as the first, then stops
    (`matched the first pass`), or sooner when the user says stop (`the user said stop`). The user does
    not set a clock. Does not write the checks the plan already named. Does not start Specify, Plan, or
    Build. A bug is not sent to `/crav1-fix-bug` unless the user says so in that turn. Not a starter option.
    Asking for startup options names only the six and does not run this command.
  use_when: A build of a slice already exists
  table:
    reads: A built slice, the spec, and the plan
    writes: Bugs in `docs/specs/<slug>/explore.md`
  reads: Reads a built slice, `spec.md`, and `plan.md`.
  writes: Writes bugs in `docs/specs/<slug>/explore.md`.
  leaves_alone: Leaves `spec.md`, `plan.md`, `tasks.md`, `verify.md`, application code, and the checks
    the plan already named alone.
  exceptions: no build of the slice stops with nothing written. The second pass stops at `matched the
    first pass`, or sooner at `the user said stop`. It does not start Specify, Plan, or Build. It is not
    a starter option.
  called_by: Called by the user.
  runs_by_itself: Calls `/crav1-fix-bug` only when the user says so in that turn.
  you_run_next:
  - /crav1-finalize-commit
  first_prompt: '/crav1-run-exploratory-test

    @docs/specs/<slug>/


    Use the slice once, then again with randomness. Write down bugs. Do not start Specify, Plan, or Build.'
- name: crav1-suggest-tests-for-code
  lane: cross-cutting
  group: Testing helpers
  starter: false
  since: 1.17.0
  stage: stable
  walkthrough: docs/from-suggest-tests.md
  purpose: The user points at code that already exists, one repo or one area, not the whole system.
  in_depth:
  - 'When the user points at code that already exists, one repo or one area, **`/crav1-suggest-tests-for-code`**
    reads that code and suggests tests for what that code can actually break. A function gets a few checks.
    A page gets a browser check. A boundary gets an integration check. It does not dump every test type.
    Every suggestion stays listed. Nothing is dropped to keep the list short. The user takes them one
    at a time: keep, leave, or dismiss. Dismiss means it is not offered again. A kept suggestion goes
    onto the existing spec through `/crav1-add-to-spec`. Plan turns it into a task. It does not write
    the tests, change the code, or start Specify, Plan, or Build. It is cross-cutting. It may run from
    any lane. It does not move work into a lane. It is a later skill. It is not a starter option. Asking
    for startup options names only the six and does not run this command. The six starter options
    stay unchanged.'
  - The user points at code that already exists, one repo or one area, not the whole system. Suggests
    tests for what that code can break. A function gets a few checks. A page gets a browser check. A boundary
    gets an integration check. Does not dump every test type. Every suggestion stays listed. Keep, leave,
    or dismiss, one at a time. Dismiss means it is not offered again. A kept suggestion goes onto the
    existing spec through `/crav1-add-to-spec`. Plan turns it into a task. Does not write the tests, change
    the code, or start Specify, Plan, or Build. Not a starter option. Asking for startup options names
    only the six and does not run this command. The six starter options stay unchanged.
  use_when: The user points at existing code
  table:
    reads: That code, its tests, and the spec
    writes: Nothing itself; a kept or dismissed suggestion goes onto the spec through `/crav1-add-to-spec`
  reads: Reads one repo or one area of code that already exists, the tests with that code, and the existing
    spec.
  writes: Writes nothing itself.
  leaves_alone: Leaves tests, application code, `plan.md`, and `tasks.md` alone.
  exceptions: the whole system, no code pointed at, or no existing spec stops with no list. Leave writes
    nothing and is offered again. Dismiss is not offered again. It does not start Specify, Plan, or Build.
    Plan turns a kept suggestion into a task. It is not a starter option.
  called_by: Called by the user.
  runs_by_itself: Calls `/crav1-add-to-spec` for one kept suggestion and for one dismissed suggestion.
  you_run_next:
  - /crav1-plan-from-spec
  first_prompt: '/crav1-suggest-tests-for-code

    @<one repo or one area>

    @docs/specs/<slug>/


    Suggest tests for what this code can break. Do not write the tests. Do not change the code.'


subagents:
- name: crav1-spec-reviewer-agent
  lane: specify
  since: 1.0.0
  purpose: Independent product and spec critique.
  started_by: The user, or a parent that delegates a spec review
  reads: '`spec.md` and what the spec links to.'
  writes: Nothing
  leaves_alone: The spec and code.
- name: crav1-review-architecture-agent
  lane: specify
  since: 1.0.0
  purpose: Hunches versus decisions, diagrams, and ADRs.
  started_by: '`/crav1-review-architecture`'
  reads: '`spec.md`, `diagrams.md`, `adr/`, and `export/` when those exist.'
  writes: Nothing
  leaves_alone: The spec and code.
- name: crav1-plan-reviewer-agent
  lane: plan
  since: 1.0.0
  purpose: Plan and tasks against the spec.
  started_by: '`/crav1-review-plan`'
  reads: '`spec.md`, `plan.md`, and `tasks.md`.'
  writes: Nothing
  leaves_alone: The plan and code.
- name: crav1-build-task-agent
  lane: build
  since: 1.0.0
  purpose: One `T#` from implement to commit, in isolation.
  started_by: '`/crav1-build-tasks`, `/crav1-build-features`'
  reads: One `T#` (`spec.md`, `plan.md`, `tasks.md`).
  writes: That task's code, `tasks.md`, `verify.md`, `fix-log.md` when a fix runs, and the commits
  leaves_alone: '`spec.md`, other `T#`s, push, and the pull request.'
  calls: '`/crav1-build-tasks`, `/crav1-verify-build-against-spec`, `/crav1-fix-build-gaps`, and `/crav1-finalize-commit`.'
- name: crav1-bundle-slice-agent
  lane: specify
  since: 1.0.0
  purpose: One v0 feature slug after the intake map.
  started_by: '`/crav1-bundle-to-specs`'
  reads: '`docs/system/` and what the parent passes for that slug.'
  writes: '`docs/specs/<slug>/` only'
  leaves_alone: '`docs/system/`, `work-item.md`, code, and every other slug.'
