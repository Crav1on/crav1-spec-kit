# Skill data for the CRAV1 Spec Kit docs.
#
# This file is the one source for docs/reference/skills.md and
# docs/reference/skills/crav1-<name>.md. Do not edit those pages by hand.
# After a change here, run: python3 scripts/gen-skill-docs.py
# CI runs: python3 scripts/gen-skill-docs.py --check
#
# Lanes: starters is the list of the six starter options. Every skill also
# has one lane (specify, plan, build, cross-cutting) and one group inside it.
# Groups are reading aids. Lanes are the routing authority (docs/guild-routing.md).
#
# Per skill:
#   table.reads / table.writes  short cells for the skills table; writes lists
#                               every side effect
#   reads / writes / leaves_alone / exceptions / called_by / runs_by_itself
#                               the full behavior, one source for the
#                               per-skill page (was the behavior map in
#                               .cursor/rules/kit-maintainer.mdc)
#   in_depth                    longer reader-facing text (moved from the README)
#   you_run_next                what the user usually runs next
#   walkthrough                 a docs/from-*.md page, or null for reference only
#   since                       first release that names the skill
#   stage                       stable unless marked otherwise

starter_options:
- crav1-spark-to-spec
- crav1-ideas-to-spec
- crav1-bundle-to-specs
- crav1-existing-to-specs
- crav1-read-environment
- crav1-fix-bug
lanes:
- id: specify
  title: Specify
  groups:
  - Start
  - Specify
- id: plan
  title: Plan
  groups:
  - Plan
- id: build
  title: Build
  groups:
  - Build
  - Verify and fix
- id: cross-cutting
  title: Cross-cutting
  groups:
  - Start
  - Meetings and open questions
  - Keep the picture current
  - Azure Boards
  - Testing helpers
  - Commit and pull request
skills:
- name: crav1-spark-to-spec
  lane: specify
  group: Start
  starter: true
  since: 1.0.0
  stage: stable
  walkthrough: docs/from-nothing.md
  purpose: Turn a one- or two-sentence spark into spec.md.
  in_depth:
  - One-liner → questions → thin `docs/system/` when missing, including `glossary.md`, then `spec.md`,
    then one index row (greenfield, brownfield feature, or later feature on an existing landscape; new
    slug unless they extend). An existing landscape is left in place. A missing `glossary.md` is filled.
    New glossary rows are appended. Existing rows are not rewritten. A meaning the source does not state
    is `to be researched`. That same pass adds what is new to the short description, the diagram, and
    how the parts connect. It does not rewrite what is already there. On Azure Repos, offers once to write
    `work-item.md`.
  use_when: You have 1–2 sentences
  table:
    reads: The spark, the repo
    writes: '`spec.md`, a thin `docs/system/` if missing (otherwise one index row and new glossary rows),
      the picture update, the slice `Synced at` line, `work-item.md` on an Azure Repos opt-in, and `Used
      by` on a quoted note'
  reads: Reads the spark and the repo.
  writes: 'Writes `docs/specs/<slug>/spec.md`, a thin `docs/system/` including `glossary.md` when that
    folder is missing, otherwise one index row plus a missing glossary or new glossary rows, and `work-item.md`
    when the user opts in on Azure Repos. A `repos.md` it writes includes a `Synced at` column and leaves
    that cell empty. When this run read only that slice''s code, writes or updates `Synced at: <repo>
    <branch>@<short sha>, <date>` on that slice''s `spec.md` and does not touch the repo column.'
  leaves_alone: Leaves application code and an existing landscape alone.
  exceptions: extend edits that spec and adds no second index row. A quoted note in `docs/notes/` gets its slug in `used_by` and a `Full source:` link; notes are never absorbed (1.61.0).
  called_by: Called by the user.
  runs_by_itself: Calls `/crav1-create-feature-branch` when the repo already has commits.
  you_run_next:
  - /crav1-create-feature-branch
  - /crav1-review-architecture
  - /crav1-tighten-spec
  first_prompt: '/crav1-spark-to-spec


    Spark: <one or two sentences>


    Treat this as greenfield. Do not write code. Ask questions first.'
- name: crav1-ideas-to-spec
  lane: specify
  group: Start
  starter: true
  since: 1.0.0
  stage: stable
  walkthrough: docs/from-ideas.md
  purpose: Turn a free-form pile of ideas (and any technical hunches in the same text) into a spec, diagrams,
    ADRs, and a chosen export format.
  in_depth:
  - Idea pile + technical hunches → thin `docs/system/` when missing, including `glossary.md`, then spec,
    diagrams, ADRs, chosen export, then one index row. An existing landscape is left in place. A missing
    `glossary.md` is filled. New glossary rows are appended. Existing rows are not rewritten. A meaning
    the source does not state is `to be researched`. That same pass adds what is new to the short description,
    the diagram, and how the parts connect. It does not rewrite what is already there. On Azure Repos,
    offers once to write `work-item.md`.
  use_when: A pile of ideas and hunches
  table:
    reads: One unstructured pile and the repo
    writes: '`spec.md`, `diagrams.md`, slice ADRs, the chosen `export/`, optional `notes.md`, the same
      landscape result as spark, `Synced at`, `work-item.md` on an Azure Repos opt-in, and `Used by` on
      a quoted note'
  reads: Reads one unstructured pile and the repo.
  writes: 'Writes `spec.md`, `diagrams.md`, slice ADRs, the chosen `export/`, optional `notes.md`, the
    same landscape or index-and-glossary result as spark, and `work-item.md` on an Azure Repos opt-in.
    Where it reads a whole repo, sets that repo''s `Synced at` cell and touches only those repos. Where
    it reads only one slice, leaves that column alone and writes or updates `Synced at: <repo> <branch>@<short
    sha>, <date>` on that slice''s `spec.md`.'
  leaves_alone: Leaves application code and the rest of an existing landscape alone.
  exceptions: two or more v0 slices or repos writes nothing and points at `/crav1-bundle-to-specs`. A quoted note in `docs/notes/` gets its slug in `used_by` and a `Full source:` link; notes are never absorbed (1.61.0).
  called_by: Called by the user.
  runs_by_itself: Calls `/crav1-create-feature-branch` when the repo already has commits.
  you_run_next:
  - /crav1-create-feature-branch
  - /crav1-review-architecture
  - /crav1-tighten-spec
  first_prompt: '/crav1-ideas-to-spec


    <paste the pile in your own words. Mix product ideas and technical thoughts.

    You can mention an export format in the same text (EARS, BDD, OpenSpec, YAML,

    JSON, BMAD) or skip it and the skill will ask.>


    Treat hunches as proposed, not decided.

    Do not write code. Capture first, then architecture questions.'
- name: crav1-bundle-to-specs
  lane: specify
  group: Start
  starter: true
  since: 1.0.0
  stage: stable
  walkthrough: docs/from-bundle-to-specs.md
  purpose: Turn mixed intake (notes, diagrams, screenshots, optional code as context) into docs/system/
    (including glossary.md) plus one spec slug per v0 feature.
  in_depth:
  - Mixed intake → `docs/system/` (including `glossary.md`) + one spec per v0 feature (isolated slice
    workers). A missing `glossary.md` is filled when the folder already exists. New glossary rows are
    appended. Existing rows are not rewritten. A meaning the source does not state is `to be researched`.
    That same pass adds what is new to the short description, the diagram, and how the parts connect.
    It does not rewrite what is already there. On Azure Repos, one optional work-item question for the
    new slugs.
  use_when: Mixed files, or several v0 features
  table:
    reads: The intake files
    writes: '`docs/system/` with `glossary.md`, one spec per confirmed v0 feature, the landscape index,
      `work-item.md` on an Azure Repos opt-in, `docs/sources/` for an imported source, the transfer data
      policy after a yes, `Synced at`, and `Used by` on a quoted note'
  reads: Reads the intake files.
  writes: 'Writes `docs/system/` including `glossary.md` (a missing glossary and new rows when the folder
    already exists), one `docs/specs/<slug>/` per confirmed v0 feature, the landscape index, `work-item.md`
    on an Azure Repos opt-in, and `docs/sources/YYYY-MM-DD-<slug>/` when an intake file it quotes is an
    imported source, following `crav1-add-to-spec` `references/sources.md`. That check may write the transfer
    data policy after a yes. Cursor: `.cursor/rules/crav1-transfer-data-policy.mdc`. Claude Code project:
    `.claude/rules/crav1-transfer-data-policy.md`. It never writes a secrets choice into that file. For
    a mail, it lists each embedded image, inline or attached. It recommends convert to text when the image
    is a diagram, a table, or text that can be reproduced exactly, and compress otherwise. It asks once
    before the source folder is written. Auto-accept applies to those recommendations only when the transfer
    data policy clearly covers them. Where it reads a whole repo, sets that repo''s `Synced at` cell and
    touches only those repos. Where it reads only one slice, leaves that column alone and writes or updates
    `Synced at: <repo> <branch>@<short sha>, <date>` on that slice''s `spec.md`.'
  leaves_alone: Leaves application code, `plan.md`, and later slices alone. Does not commit.
  exceptions: prompts `/crav1-finalize-commit` and does not run it. A quoted note in `docs/notes/` gets its slug in `used_by` and a `Full source:` link; notes are never absorbed (1.61.0).
  called_by: Called by the user.
  runs_by_itself: Calls `/crav1-create-feature-branch` when the repo already has commits.
  you_run_next:
  - /crav1-create-feature-branch
  - /crav1-review-architecture
  - /crav1-tighten-spec
  - /crav1-finalize-commit
  first_prompt: '/crav1-bundle-to-specs

    @notes/overview.md

    @sketches/flow.png

    @legacy-api/


    <optional sentence: new system, that code is context — or extract-as-is>


    Treat hunches as proposed, not decided.

    Do not write code. Map first, then landscape, then one spec per v0 slug.'
- name: crav1-existing-to-specs
  choice_words:
  - question: What to read
    words:
    - word: "repos only"
      means: "repos only"
    - word: "repos and bundle"
      means: "repos plus a bundle"
  - question: What to write
    words:
    - word: "one spec"
      means: "one spec (the architecture spec)"
    - word: "spec per feature"
      means: "system notes plus one spec per feature"
  lane: cross-cutting
  group: Start
  starter: true
  since: 1.0.0
  stage: stable
  walkthrough: docs/from-existing-to-specs-with-bundle.md
  purpose: Turn a system that already exists into specs; asks repos only or repos plus a bundle, and one
    spec or system notes plus one spec per feature.
  in_depth:
  - '**`/crav1-existing-to-specs`** is a starter option. It opens with two questions: repos only, or repos
    plus a bundle to match; and one spec (the architecture spec), or system notes plus one spec per feature.
    It skips a question the message answers. It still runs only when the user names the repos. It replaces
    repos-to-spec and match-to-specs; their rules are kept as branches.'
  - 'Repos plus a bundle (was `/crav1-match-to-specs`): Existing repos plus a dump → where the spec files
    go, then `docs/system/` (including `glossary.md`) and one spec per confirmed slice (done, partial,
    or not in the code). Fills a missing `glossary.md` when the folder already exists. New glossary rows
    are appended. Existing rows are not rewritten. A meaning the source does not state is `to be researched`.
    That same pass adds what is new to the short description, the diagram, and how the parts connect.
    It does not rewrite what is already there. Not intake, spark, or ideas. Does not plan, implement,
    or commit.'
  - 'Repos only (was `/crav1-repos-to-spec`): When the user names one or more repos and wants the architecture
    the code shows, **`/crav1-existing-to-specs`** reads those repos and writes one architecture spec
    the lanes can extend (`docs/architecture/spec.md`) when that file is missing. It writes the system
    notes under `docs/system/` when those notes are missing. When a real system note is already there,
    it leaves those notes except the `Synced at` cell of a repo it read, and writes the missing architecture
    spec and `docs/architecture/left-out.md`. When the architecture spec or those notes are already there,
    a later re-read adds only what is new and does not rewrite lines that are already there, except that
    `Synced at` cell, and removes a left-out line when the code shows it. A fact the code shows is confirmed.
    Before any file is written, the confirmation is one question per section. A guess stays out of the
    spec until that section accepts it. A guess that stays left out is written to `docs/architecture/left-out.md`.
    A link between repos is written only when the code shows it. If none is found, the command says so.
    It does not invent links. It is cross-cutting. It is not a lane and not a mode of Specify. It does
    not design the next feature, write application code, or start Specify, Plan, or Build. It is not `/crav1-add-to-spec`.'
  - 'Repos only (was `/crav1-repos-to-spec`): The user names one or more repos. Reads those repos and
    writes `docs/architecture/spec.md` when that file is missing, and the `docs/system/` notes `/crav1-explain-existing-system`
    reads when those notes are missing. When a real system note is already there, leaves those notes except
    the `Synced at` cell of a repo it read, and writes the missing architecture spec and `docs/architecture/left-out.md`.
    A later re-read adds only what is new and does not rewrite those lines, except that `Synced at` cell,
    and removes a left-out line when the code shows it. Before any file is written, one question per section.
    A fact the code shows is confirmed. A guess stays out until that section accepts it. A guess that
    stays left out is written to `docs/architecture/left-out.md`. A link is written only when the code
    shows it. If none is found, says so and does not invent a link. Does not design the next feature,
    write application code, or start Specify, Plan, or Build. Not `/crav1-add-to-spec`.'
  use_when: The user names existing repos, with or without a bundle to match
  table:
    reads: 'Repos plus a bundle: The repos and the dump; Repos only: Those repos, and left-out when present'
    writes: 'Repos plus a bundle: Landscape gaps (including a missing glossary and new rows), one spec
      per confirmed slice, index rows, `docs/sources/` for an imported source, the transfer data policy
      after a yes, and `Used by` on a quoted note; Repos only: `docs/architecture/spec.md` when missing,
      `docs/architecture/left-out.md`, the system notes when missing, and `Synced at` on each repo it
      read'
  reads: 'Repos plus a bundle: Reads the repos and the dump. Repos only: Reads the repos the user named,
    and `docs/architecture/left-out.md` when that file is there.'
  writes: 'Repos plus a bundle: Writes `docs/system/` in the destination the user picks (gaps only when
    it exists, including a missing glossary and new rows) and one `docs/specs/<slug>/spec.md` per confirmed
    slice, including not in the code, then index rows. When a dump file it quotes is an imported source,
    also writes `docs/sources/YYYY-MM-DD-<slug>/`, following `crav1-add-to-spec` `references/sources.md`.
    That check may write the transfer data policy after a yes. Cursor: `.cursor/rules/crav1-transfer-data-policy.mdc`.
    Claude Code project: `.claude/rules/crav1-transfer-data-policy.md`. It never writes a secrets choice
    into that file. For a mail, it lists each embedded image, inline or attached. It recommends convert
    to text when the image is a diagram, a table, or text that can be reproduced exactly, and compress
    otherwise. It asks once before the source folder is written. Auto-accept applies to those recommendations
    only when the transfer data policy clearly covers them. A `repos.md` it writes includes a `Synced
    at` column and leaves that cell empty. It does not set or clear an existing cell. Repos only: Writes
    `docs/architecture/spec.md` when that file is missing, `docs/architecture/left-out.md` for guesses
    that stay left out, and the `docs/system/` notes `/crav1-explain-existing-system` reads when those notes are missing.
    Sets `Synced at` on each repo it read and touches only those repos.'
  leaves_alone: 'Repos plus a bundle: Leaves application code, `plan.md`, `work-item.md`, and the rest
    of an existing landscape alone. Does not commit. Repos only: Leaves application code and the next
    feature alone. On the pass that creates the architecture spec while system notes are already there,
    that cell is the only edit to those notes.'
  exceptions: 'Repos plus a bundle: a slice that is not in the code stays thin and is not planned here.
    A quoted note in `docs/notes/` gets its slug in `used_by` and a `Full source:` link; notes are never absorbed (1.61.0). Repos only: before writing, one question per section (each
    named repo, inferred guesses, links, left-out) and every item stays listed. A later re-read adds only
    what is new to the spec and notes, sets `Synced at` for repos it read without rewriting the rest of
    that row, and removes a left-out line when the code shows it or that section dismisses it. A guess
    stays out until that section accepts it. A link is written only when the code shows it.'
  called_by: Called by the user.
  runs_by_itself: 'Repos plus a bundle: Calls `/crav1-create-feature-branch` in that destination when it already
    has commits. Repos only: Calls `/crav1-create-feature-branch` when the destination already has commits.'
  you_run_next:
  - /crav1-finalize-commit
  first_prompt: '/crav1-existing-to-specs

    @repo-a/

    @repo-b/

    @notes/old-spec.md

    @tickets/


    The repos are what exists. The dump is what to match.

    Do not write code. Ask where the specs go, then map, and stop.'
- name: crav1-read-environment
  lane: cross-cutting
  group: Start
  starter: true
  since: 1.13.0
  stage: stable
  walkthrough: docs/from-read-environment.md
  purpose: Read the host the user named.
  in_depth:
  - 'When the user names a host, **`/crav1-read-environment`** reads every non-prod environment on that
    host in one pass. Examples: Azure, AWS, Google Cloud. It does not guess the host. Naming production,
    prod, or live stops. It never reads production data. This build has readers for Azure, AWS, and Google
    Cloud. Any other host stops with no reader. It does not read Azure DevOps, GitHub, or CI. The user
    names the host, not the subscription, the account, or the project. Each seen line keeps its own environment.
    A prod-only resource has a production mark and no non-prod twin. Pre-prod, resources shared with prod,
    and prod-only resources are shape and connections only, after one yes. A no leaves prod-only skipped.
    A line from that yes says `prod only`. After that read, and before any section, it can look inside
    a database or storage when the user says yes. SQL is metadata only. Storage is structure only. It
    never reads a row or a blob. Production is never opened. The only file this command writes is `docs/environments/marks.md`,
    by appending a line the user confirmed. After a section is confirmed, the skill that already owns
    the file adds only what is new. A fact is seen in that environment. A link, including a trigger definition,
    is added only when the environment shows the connection. It is cross-cutting. It is not a lane. It
    does not start Specify, Plan, or Build.'
  - The user names the host. One pass reads every non-prod environment. Azure, AWS, and Google Cloud readers.
    Any other host stops with no reader. Naming production, prod, or live stops. Never production data.
    Pre-prod, shared-with-prod, and prod-only are shape and connections only, after one yes. A no leaves
    prod-only skipped. After that read, optional SQL metadata and storage structure, only when the user
    says yes. Never rows, blobs, or production. Look-inside never opens production. Appends confirmed
    lines to `docs/environments/marks.md`. Does not write `docs/system`, `docs/architecture/spec.md`,
    a feature spec, or `docs/architecture/left-out.md`. After a confirmed section, the owner adds only
    what is new. A fact is seen in that environment. A link only when the environment shows the connection.
    Does not start Specify, Plan, or Build.
  use_when: The user names the host
  table:
    reads: Non-prod resources on that host
    writes: Confirmed lines appended to `docs/environments/marks.md`; confirmed sections go to their owners
      through `/crav1-refresh-system-notes`, `/crav1-existing-to-specs`, or `/crav1-add-to-spec`
  reads: Reads the host the user named, non-prod resources on that host, prod-only resources for shape
    and connections when the user says yes, and `docs/environments/marks.md` when it exists. After that
    read, optional SQL metadata and storage structure only when the user says yes.
  writes: Writes only confirmed lines appended to `docs/environments/marks.md`.
  leaves_alone: Leaves `docs/system`, `docs/architecture/spec.md`, feature specs, `docs/architecture/left-out.md`,
    and application code alone.
  exceptions: does not guess the host. Naming production, prod, or live stops. One pass covers every non-prod
    environment. Pre-prod, shared-with-prod, and prod-only stay shape and connections until one yes. A
    no leaves prod-only in Skipped. Look-inside never opens production. A database with no clear environment
    is asked before it is opened. Missing access stops that look-inside. Never rows, blobs, or production
    data. Azure, AWS, and Google Cloud each have a reader. Any other host stops with no reader. A fact
    is seen in that environment. A prod-only line says `prod only`. A link only when the environment shows
    the connection. Does not start Specify, Plan, or Build. Names `/crav1-map-pipeline-environments` and does
    not run it. After `marks.md` lines are added, it asks once whether to run `/crav1-refresh-system-notes` and
    does not run that refresh from the question.
  called_by: Called by the user.
  runs_by_itself: Calls `/crav1-refresh-system-notes`, `/crav1-existing-to-specs`, and `/crav1-add-to-spec` for the
    append only after that section is confirmed.
  you_run_next:
  - /crav1-finalize-commit
  first_prompt: '/crav1-read-environment


    Azure.

    List every non-prod environment. A prod-only resource is shape and connections only, after one yes.
    Do not guess the host.'
- name: crav1-fix-bug
  lane: cross-cutting
  group: Start
  starter: true
  since: 1.7.0
  stage: stable
  walkthrough: docs/from-fix-bug.md
  purpose: Name one real bug the user already named.
  in_depth:
  - When a real bug is named, **`/crav1-fix-bug`** says where it was seen, names the bug, points at the
    spec or the shipped behavior it breaks, and names the lane. A real bug is a verify failure on work
    that is already shipping, or a defect that comes in from outside. It is cross-cutting. It is not a
    lane and not a stretch of verify. It does not start that lane, edit code, open a pull request, or
    create an Azure Boards work item. If no bug is named, it stops. It does not go hunting. When you ask
    for startup options, it is one of the six starter options. That ask names the list and does not
    run it. It is an intake for a bug that already exists. It still runs only when you name a real bug.
    It is not a skill that runs because a repo is new, and it is not started automatically. Spark, specify,
    plan, and verify do not run it.
  - Names one real bug the user already named (a verify failure on work that is already shipping, or a
    defect from outside). Says where it was seen, what it breaks, and the lane. Does not start that lane,
    edit code, open a pull request, or create an Azure Boards work item. Stops when no bug is named. Not
    a lane and not a stretch of verify. Starter option. Asking for startup options names it and does not
    run it. It still runs only when the user names a real bug. Not a new-repo start. Not started automatically.
    Spark, specify, plan, and verify do not run it.
  use_when: The user names a real bug
  table:
    reads: That bug and a spec already in front
    writes: Nothing
  reads: Reads only the bug the user named and a spec already in front of them.
  writes: Writes nothing.
  leaves_alone: Leaves code, specs, plans, `verify.md`, and `work-item.md` alone.
  exceptions: no bug named, or not a real bug, stops with no lane. Spark, specify, plan, and verify do
    not run it. When the bug changes how the parts connect, it asks once whether to run `/crav1-refresh-system-notes`
    and does not run it.
  called_by: Called by the user.
  runs_by_itself: Calls no skill.
  you_run_next:
  - The lane it names (Specify, Plan, or Build)
  first_prompt: '/crav1-fix-bug


    Bug: <what is wrong>

    Seen: <verify | a report | production>


    Name the lane. Do not edit code. Do not open a pull request.'
- name: crav1-create-feature-branch
  lane: cross-cutting
  group: Commit and pull request
  starter: false
  since: 1.0.0
  stage: stable
  walkthrough: docs/from-draft-spec.md
  purpose: Create or check out feat/<slug> (one branch for spec+build) or spec/<slug> (specify-only; build
    later on feat/<slug>).
  in_depth:
  - Prompt for `feat/<slug>` or specify-only `spec/<slug>`; no silent checkout, no push, no PR.
  - '1.64.0: the Build prompt puts a task''s `(branch: …)` first, marked (Recommended), and never creates it from default without asking.'
  use_when: 'Brownfield: leave the default branch'
  table:
    reads: Current branch, default branch, dirty tree
    writes: A local `feat/<slug>` or `spec/<slug>` checkout
  reads: Reads the current branch, the default branch, and whether the tree is dirty.
  writes: Writes a local checkout of `feat/<slug>` or `spec/<slug>` after the user picks.
  leaves_alone: Leaves commits, push, and the pull request alone.
  exceptions: skips the prompt when there is no repo, no commits, or the branch is already right. A dirty
    tree does not checkout.
  called_by: Called by the user, `/crav1-spark-to-spec`, `/crav1-ideas-to-spec`, `/crav1-bundle-to-specs`,
    `/crav1-existing-to-specs`, `/crav1-build-tasks`,
    and `/crav1-build-features`.
  runs_by_itself: Calls no skill.
  you_run_next:
  - /crav1-review-architecture
  - /crav1-tighten-spec
