name: Kit lint

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill links, front matter, skills.yaml, skill copies
        run: python3 scripts/kit-lint.py .
      - name: Unit tests (task-order sort, report routing)
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mermaid blocks parse (mermaid 11.4.1, templates and goldens)
        run: scripts/check-mermaid.sh
