name: Drop-in, plugin, Claude sync, and docs checks

on:
  pull_request:
  push:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if drop-in and plugin drift
        run: |
          set -euo pipefail
          fail=0

          echo "== skills: .cursor/skills/crav1/ ↔ plugins/crav1/skills/ =="
          if ! diff -ru .cursor/skills/crav1 plugins/crav1/skills; then
            fail=1
          fi

          echo "== agents: crav1-*.md =="
          agent_drop="$(mktemp -d)"
          agent_plug="$(mktemp -d)"
          find .cursor/agents -maxdepth 1 -type f -name 'crav1-*.md' -exec cp -a {} "$agent_drop/" \;
          find plugins/crav1/agents -maxdepth 1 -type f -name 'crav1-*.md' -exec cp -a {} "$agent_plug/" \;
          if ! diff -ru "$agent_drop" "$agent_plug"; then
            fail=1
          fi
          rm -rf "$agent_drop" "$agent_plug"

          echo "== rules: crav1.mdc =="
          if ! diff -u .cursor/rules/crav1.mdc plugins/crav1/rules/crav1.mdc; then
            fail=1
          fi

          echo "== agent-assets =="
          if ! diff -ru .cursor/agent-assets plugins/crav1/agent-assets; then
            fail=1
          fi

          echo "== docs: docs/ ↔ bundled crav1-docs/ in every install (Cursor drop-in, plugin, Claude Code) =="
          for d in .cursor/skills/crav1/crav1-docs plugins/crav1/skills/crav1-docs .claude/skills/crav1-docs; do
            if ! diff -ru -x CHANGELOG.md docs "$d" || ! diff -u CHANGELOG.md "$d/CHANGELOG.md"; then
              echo "$d differs from docs/ or CHANGELOG.md; run scripts/sync-crav1-plugin.sh"
              fail=1
            fi
          done
          if [ -e plugins/crav1/docs ]; then
            echo "plugins/crav1/docs/ is gone since 1.53.0; the plugin bundles docs in skills/crav1-docs/"
            fail=1
          fi

          echo "== kit-maintainer.mdc must not be under plugins/crav1/ =="
          if find plugins/crav1 -name 'kit-maintainer.mdc' -print | grep -q .; then
            echo "found kit-maintainer.mdc under plugins/crav1/"
            find plugins/crav1 -name 'kit-maintainer.mdc' -print
            fail=1
          fi

          echo "== claude drop-in: committed .claude/ must match a fresh generate =="
          if ! scripts/sync-crav1-claude.sh --check; then
            fail=1
          fi

          echo "== kit-maintainer.mdc must not be under .claude/ =="
          if find .claude -name 'kit-maintainer.mdc' -print | grep -q .; then
            echo "found kit-maintainer.mdc under .claude/"
            find .claude -name 'kit-maintainer.mdc' -print
            fail=1
          fi

          exit "$fail"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Skills reference matches docs/reference/skills.yaml
        run: python scripts/gen-skill-docs.py --check
      - name: Description length and plugin.json version
        run: python scripts/check-kit-docs.py
      - name: Workflow routes, you_run_next, crav1.mdc order, help rule, and After sections
        run: python scripts/gen-workflow.py --check
      - name: Marks tables match docs/reference/marks.yaml, examples match formats, writers and readers mention their marks
        run: python scripts/gen-marks.py --check
      - name: Notes index generator builds, checks, and migrates (selftest)
        run: python .cursor/skills/crav1/crav1-add-to-spec/scripts/notes_index.py --selftest
