    git remote is not Azure Repos and `docs/environments/marks.md` does not name the Azure DevOps org
    and project, derives them from Azure DevOps URLs in `docs/system/repos.md` and reads those work items,
    pull requests, and branches the same way, each tagged as a live read. Before reporting `az` as not
    installed, checks the default install paths on Windows, macOS, and Linux and uses that path when it
    is there.
  writes: Writes nothing.
  leaves_alone: Leaves specs, code, marks, commits, and pull requests alone.
  exceptions: pasted minutes or a long dump stops and names `/crav1-meeting-to-specs` or `/crav1-match-dump-to-specs`.
    Two or more close hits ask which. A live-read failure offers Retry or Skip. It does not start Specify,
    Plan, or Build. It is not a starter option.
  called_by: Called by the user.
  runs_by_itself: Calls no skill.
  you_run_next:
