  writes: Writes kept findings to `docs/system/security.md` or a Security section on that spec.
  leaves_alone: Leaves code, `plan.md`, and commits alone.
  exceptions: spark, plan, and verify do not run it. `/crav1-architecture-reviewer` may name it and does
