- name: crav1-keep-current
  lane: cross-cutting
  group: Keep the picture current
  starter: false
  since: 1.8.0
  stage: stable
  walkthrough: docs/from-keep-current.md
  purpose: 'Update the picture in docs/system/ when something was added: add what is new to the short
    description, the diagram, and how the parts connect, and do not rewrite what is there.'
  use_when: Something was added; catch the picture up
  table:
    reads: The picture and what the spec states
    writes: New lines on the description, diagram, and connections, `Synced at` (repo cell or slice line),
      and a cleared, narrowed, or routed research mark when pointed at an updated note
  reads: Reads the picture and what a spec already states.
  writes: 'Writes new lines on the short description, the context diagram, and how the parts connect.
    When this run reads a whole repo, sets that repo''s `Synced at` cell and touches only those repos.
    When this run reads only one slice, leaves that column alone and writes or updates `Synced at: <repo>
    <branch>@<short sha>, <date>` on that slice''s `spec.md`. Reading specs does not set it. A consumer
    measuring drift uses the older of the repo column and the slice line, and an empty value means unknown,
    so fall back to spec file commit dates. When pointed at an updated note in `docs/research/`, checks
    each listed point and clears, narrows, or routes it. An older mark with no point lines is split into
    the hits it was made from. It also routes the note''s own open questions when the answer lies outside
    the note''s owner, including when the mark clears. It does not ask the user.'
  leaves_alone: Leaves existing picture lines, glossary rows, design, and build alone.
  exceptions: spark, ideas, intake, match, match-dump, and code-into-specs run this picture update on
    the pass that appends a glossary row. Repos-to-spec updates the picture in its own pass. Complete-features,
    fix-bug, fix-live, environment-read, and the add-to-spec handoffs from environment-read and suggest-tests-for-code
    may ask and do not run this command. Implement-task and complete-task do not ask. It does not commit
    a cleared research mark.
  called_by: Called by the user and by `/crav1-environment-read` for a confirmed system section.
  runs_by_itself: Calls no skill.
  you_run_next:
  - /crav1-finalize-commit
  first_prompt: '/crav1-keep-current

    @docs/system/

    @docs/specs/


    Add what the specs already state to the picture. Do not rewrite what is already there. Do not write
    code.'
