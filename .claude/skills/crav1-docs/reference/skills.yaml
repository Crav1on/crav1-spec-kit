- name: crav1-build-tasks
  choice_words:
  - question: Which tasks
    words:
    - word: "one task"
      means: "one task (add `T#`, or the first unticked)"
    - word: "range"
      means: "a range (add `T#-T#`)"
    - word: "all tasks"
      means: "all unticked tasks"
  - question: Branch
    words:
    - word: "new branch"
      means: "on a base or other branch, create feat/<slug> from the into branch (1.99.0)"
  lane: build
  group: Build
  starter: false
  since: 1.0.0
  stage: stable
  prompt_budget: 4
  walkthrough: docs/from-plan-to-build.md
  purpose: Build tasks from tasks.md, always in an isolated worker per task; asks which tasks (one, a
    range, or all).
  in_depth:
  - '1.99.0: on a base branch the Build prompt has no Stay, a headless run stops unless `new branch`, a task naming a base branch is blocked, and the worker returns blocked on a base before any edit or commit.'
  - '**`/crav1-build-tasks`** opens with one question: which tasks to build, one `T#`, a range, or all
    unticked, listing the ready ones with the `/crav1-tasks-ready-to-build` rules. It skips the question
    when the message names the tasks. Every task runs in its own worker (implement, commit, verify, optional
    fix), and every path ends by naming `/crav1-open-pr`. It replaces implement-task, complete-task, and
    complete-tasks; their rules are kept as branches.'
  - 'Inside each worker (was `/crav1-implement-task`): One `tasks.md` row, then run its verify step.'
  - 'Inside each worker (was `/crav1-implement-task`): Before the tests, checks the local dependencies
    they need (Azurite, a database container, an emulator) and asks start, skip, or stop for one that
    is not running. Tests skipped for a missing dependency do not tick the row unless you chose skip.'
  - 'One task (was `/crav1-complete-task`): Isolated worker for one `T#`: implement → commit → verify
    → optional fix; persist commit style as a rule.'
  - 'One task (was `/crav1-complete-task`): When a local test dependency is not running, the worker returns
    `needs_dependency` with a `BLOCKER:` line, and you answer start, skip, or stop.'
  - 'A range or all (was `/crav1-complete-tasks`): Orchestrates one worker per `T#` (`T1-T3` or all unchecked);
    stops the batch when a worker needs you.'
  - '1.64.0: a task''s `(branch: …)` is offered first (Recommended) in the Build prompt; range and all-tasks runs switch to each task''s branch on a clean tree, and a missing branch blocks that task.'
  - '1.68.0: offers to create a missing task sub-branch from its spec branch and writes its `(into …)` marker after the yes.'
  use_when: You want to build one task, a range, or all unticked tasks
  table:
    reads: 'Inside each worker: One `T#`, the plan, and the spec; One task: One `T#` and the persist rule;
      A range or all: The `T#` queue on one spec'
    writes: 'Inside each worker: The code and checks that `T#` names, and `[x]` on that row when its verify
      passes; One task: The commit-style rule when it is missing; its worker writes that task''s code,
      `tasks.md`, `verify.md`, `fix-log.md` when a fix runs, and the commits; A range or all: The commit-style
      rule once, when missing; one worker per `T#` writes that task''s code, `tasks.md`, `verify.md`,
      `fix-log.md` when a fix runs, and the commits'
  reads: 'Inside each worker: Reads one `T#` in `tasks.md`, plus `plan.md` and `spec.md`. One task: Reads
    one `T#` and the persist rule. A range or all: Reads the `T#` queue on one spec.'
  writes: 'Inside each worker: Writes the code and the checks that row names, and marks the row `[x]`
    only when that verify passes. One task: Writes the commit-style rule when it is missing. A range or
    all: Writes the commit-style rule once when it is missing.'
  leaves_alone: 'Inside each worker: Leaves `spec.md` and other tasks alone. One task: Leaves product
    code, `spec.md`, push, and the pull request alone in this chat. A range or all: Leaves product code,
    commits, `spec.md`, push, and the pull request alone in this chat.'
  exceptions: 'Inside each worker: stops with no code when `## Linter` says none and the user has not
    chosen to go on. It does not ask to run `/crav1-refresh-system-notes`. One task: it does not ask to run `/crav1-refresh-system-notes`.'
  called_by: Called by the user and by `crav1-build-task-agent`.
  runs_by_itself: 'Inside each worker: Calls `/crav1-create-feature-branch` before code. One task: Calls `/crav1-create-feature-branch`
    and `crav1-build-task-agent`. A range or all: Calls `/crav1-create-feature-branch` and `crav1-build-task-agent`
    once per `T#`.'
  you_run_next:
  - /crav1-open-pr
  - /crav1-verify-build-against-spec
  - /crav1-finalize-commit
  first_prompt: '/crav1-build-tasks


    @docs/specs/<slug>/'
