    Merge this pull request.'
- name: crav1-help
  lane: cross-cutting
  group: Start
  starter: false
  since: 1.52.0
  stage: stable
  prompt_budget: 1
  walkthrough: docs/from-help.md
  purpose: Answer questions about the kit from its own local docs, with the source file and anchor for every answer.
  in_depth:
  - 'Called with nothing, **`/crav1-help`** shows a usage guide with example questions. With a skill name, it says what the skill does, when to use it, what it reads and writes, and its before and after steps. With `next` or a situation, it picks the route in `docs/reference/workflow.yaml` and lists the steps in order, marked done, next, skipped, or to do from the slice''s file state (open questions, `plan.md`, ticked tasks, `verify.md`, `work-item.md`). It also explains a concept from the glossary and concept pages, lists skills by lane (`list`, `list <lane>`), gives the status of one slice (`status <slug>`, `where am I`) with the readiness rules of `/crav1-tasks-ready-to-build` and the route step it is on, compares two skills (`compare A B`), and summarizes the changelog for the installed version (`whats new`, `whats new since x.y`). A free-form question is answered from the docs, or with "the kit doesn''t say". Every answer ends with `Source: <file>#<anchor>`. On pushback it re-reads the file and keeps the answer unless the file says otherwise.'
  - It reads the kit repo's `docs/`, or the `crav1-docs/` folder bundled next to the skills (plugin, Cursor drop-in, Claude Code drop-in), never GitHub. When online, it reads the tag names once and says so when a newer version is tagged. It writes nothing and runs no other skill. It is cross-cutting. It is not a starter option.
  - '1.64.0: `status <slug>` and `where am I` add the Branches line and route unmerged work to `/crav1-open-pr` or `/crav1-merge-pr`.'
  - '1.67.1: remote copy ages count whole calendar days in local time; a commit made today is `today`, not `1 day old`.'
  - '1.68.0: status adds the `Sub-branches:` and `left behind:` lines and `merged, reverted on <base> (<sha>)`, report only.'
  - '1.69.0: status adds the `Promotion:` line from `docs/environments/promotion.md` (branch reach, release and tag patterns, `not back on <base>`), with the optional `pipeline runs` check.'
  - '1.75.0: `todo`, `todo next` (top 5) and `todo top N`, with an optional scope (person, spec, topic, branch, or pull request), rank what to do next from the records. Read-only; nothing is stored. A **Yours first** group comes from `git config user.name` or `todo for <name>`.'
  choice_words:
  - question: Also check the latest pipeline runs?
    words:
    - word: "pipeline runs"
      means: "check the latest successful Azure DevOps runs behind the Promotion line (read-only)"
  - question: What to do next (optional, never asked)
    words:
    - word: "todo"
      means: "every action from the records, ranked (read-only)"
    - word: "todo next"
      means: "the top 5"
    - word: "todo top N"
      means: "the top N"
  use_when: You want to know what to run next, in what order, or what a skill does
  table:
    reads: The kit docs (kit repo, or the bundled `crav1-docs/` next to the skills), and the slice's file state
    writes: Nothing (an answer in chat with its source)
  reads: Reads `docs/reference/workflow.yaml`, `docs/reference/skills.yaml`, the reference pages, walkthroughs, concept pages, guild routing, and `CHANGELOG.md` from the kit repo or the `crav1-docs/` folder bundled next to the skills in every install; for a route or a status, the slice's `spec.md`, `plan.md`, `tasks.md`, `verify.md`, and `work-item.md`; when online, the kit's tag names only. For `todo`, every spec in scope, its `tasks.md`, and the notes indexes; a pull request online only after a yes.
  writes: Writes an answer in the chat that ends with its source file and anchor, and at most one newer-version line per chat.
  leaves_alone: Leaves every file alone.
  exceptions: does not answer from memory, from general knowledge, or from GitHub. When the docs do not cover a question it says "the kit doesn't say". On pushback it re-reads the cited file and changes the answer only when the file says otherwise. When `crav1-docs/` is missing (only skill folders were copied), it answers from the skill files only and says so.
  called_by: Called by the user, or by an agent before it suggests more than one next step or when an order is questioned (the `crav1.mdc` rule).
  runs_by_itself: Calls no skill.
  you_run_next:
  - The skill or route step it names
  first_prompt: '/crav1-help

    I have new information from a meeting and tasks that are not built. What do I run, in order?'
- name: crav1-tasks-ready-to-build
  lane: cross-cutting
  group: Start
  starter: false
  since: 1.54.0
  stage: stable
  prompt_budget: 0
  walkthrough: docs/from-tasks-ready-to-build.md
  purpose: 'List the tasks ready to build, for one spec or all, and why the others are blocked. Read-only.'
  in_depth:
  - '**`/crav1-tasks-ready-to-build`** reads `spec.md` open questions, `plan.md` (the `Reviewed:` line and `## Risks`), `tasks.md`, and `verify.md` for one slice or every slice. A ticked task is Done when `verify.md` lists it as verified, otherwise Needs verify. Then a task is blocked by a missing `plan.md`, by a kept-open question whose `Blocks:` line names it, by a kept-open question or plan Risk with no `Blocks:` line (the whole slice, inferred), or by an unticked task in its `(after: T#)` (recorded) or, with no `(after: …)`, the task just before it (inferred). Lists and Next follow dependency order (1.103.0): the `(after: …)` graph in waves, lowest number first in a wave; Next is the ready task that unblocks the most; a cycle blocks its tasks. It may run `scripts/task_order.py` next to the skill. Otherwise it is Ready, with a warning when the plan review is unknown (inferred) or still has open `P#`s.'
