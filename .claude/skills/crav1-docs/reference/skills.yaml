    entry per branch; note indexes rebuilt with `notes_index.py`. Before the merge commit it checks that
    no line either side added is missing. One question only when the two sides say different things about
    the same fact: keep both (a `**Conflict:**` line), mine, theirs, or stop. Code file conflicts stay with
    you. When not behind, it checks any unpushed merge, including one made by hand, and offers to restore
    dropped lines; restored lines go into this run''s commit (1.91.0). `pull` does this with no commit first. It never pushes; it ends with `Ready to push.`'
