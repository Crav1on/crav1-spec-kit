    `Parked:` line in place; plan, build, and ado-sync push skip it, and add-to-spec saves matching input
    as one note waiting for it. Un-park re-reads each waiting note in full and adds the spec to `Used by`.
    Convert to note writes `docs/notes/YYYY-MM/` with a `Source:` line and a landscape line, and regenerates the notes index.'
