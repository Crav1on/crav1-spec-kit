- name: crav1-pr-status
  choice_words:
  - question: Which pull request
    words:
    - word: "pr<n>"
      means: "that pull request (also `pr <n>`, `#<n>`, `pr <repo> <n>`, or its URL)"
  - question: Your side (optional; picked from the PR author otherwise)
    words:
    - word: "as reviewer"
      means: "reviewer mode: you are not the author"
    - word: "as author"
      means: "author mode: you opened the pull request"
  - question: How much
    words:
    - word: "since last"
      means: "only what changed since your last run"
    - word: "no code"
      means: "threads only; no diff or commit check, so nothing is marked done"
  lane: cross-cutting
  group: Commit and pull request
  starter: false
  since: 1.97.0
  stage: stable
  prompt_budget: 1
  walkthrough: docs/from-pr-status.md
  purpose: Show where one pull request stands, point by point, and who owes the next step.
  in_depth:
  - '**`/crav1-pr-status`** reads one named pull request''s threads, pushes and commits on Azure DevOps or GitHub (read-only, `references/pr-threads.md` in `crav1-add-to-spec`) and splits the threads into points. Each point gets one of six statuses: `done <sha>` (a commit after the request changed the lines), `agreed`, `declined` (with the reason), `open`, `waiting on <name>`, or `needs <name>` for a third person. It picks reviewer or author mode from who opened the pull request; `as reviewer` or `as author` overrides it, and an unclear sign-in is guessed without asking.'
  - 'It prints a verdict line with the points waiting on you first, then the points by status, flags for threads resolved while the code is unchanged (and done points whose thread is still active), spec and decision candidates, follow-ups drafted for `/crav1-ado-sync`, the pull requests this one depends on and the merge order, drafted replies, a `Next for you` list (Now, After <name> answers, Later), and a merge-readiness line. `since last` shows only what changed since your last run.'
  - 'It writes all of it to the PR note''s shared `## PR record`, the same record `/crav1-review-pr`, `/crav1-add-to-spec` and `/crav1-merge-pr` use; `/crav1-merge-pr` stops on `Ready: no`. Replies are drafts and are never posted. A thread status change on the host is offered one thread at a time and made only on that thread''s yes. Spec or decision candidates are named with the command to type, `/crav1-add-to-spec pr<n> candidates`; pr-status never runs it. Follow-ups are drafts; no work item is created.'
  - '1.98.0: also reads the pull request description: a `### Merge order` section becomes `Order` lines, `### Questions for reviewers` becomes Points tagged `asked; from description <date>`, and `### Not in this PR` is offered as follow-ups (a `follow-up` Point only on a yes). `/crav1-open-pr` writes those sections.'
  - '1.100.0: the output ends with `Next for you` before the `Ready` line: **Now** (steps nothing blocks, commands in route order), **After <name> answers <point>** (one group per person, with each path when the thread names the options), and **Later** (steps behind a merge, `Ready: yes` or a push). Commands are named, never run. The closing prompt no longer asks about spec candidates; it names `/crav1-add-to-spec pr<n> candidates` instead.'
  use_when: You want to know what is done and what is left on a pull request, and what you owe
  table:
    reads: The pull request's threads, pushes and commits, its diff, and its PR record
    writes: The PR record in the PR note in `docs/notes/`; one thread status on the host per yes
  reads: Reads one named pull request's threads with every comment, its pushes with their commits and changed
    files, the signed-in user, the diff of the source branch (unless `no code`), other pull requests named as
    merge-order dependencies, and the PR note with its `## PR record` in the specs repo.
  writes: Writes the PR note's `## PR record` (a Point per point, Order, your Read line, Ready, State) and a
    `## Replies as drafted` history section, then regenerates the notes indexes; never committed. On a yes for
    that one thread, sets one thread's status on the host (Azure DevOps) or resolves or reopens it (GitHub).
  leaves_alone: Leaves code, specs, plans, tasks and work items alone. Never posts a reply, votes, approves,
    merges, or changes a thread without its own yes.
  exceptions: Signed out, the one prompt is the signed-out question and the offers are listed as text for the
    next run. Headless and bot runs ask nothing and list the offers as text.
  called_by: Called by the user.
  runs_by_itself: Calls no other skill. Names `/crav1-add-to-spec pr<n> candidates` for the spec and decision candidates; you type it.
  you_run_next:
  - /crav1-merge-pr
  - /crav1-add-to-spec
  - /crav1-ado-sync
  - /crav1-review-pr
  first_prompt: '/crav1-pr-status pr<n>


    Where does this pull request stand, and what do I owe?'
- name: crav1-merge-pr
  lane: cross-cutting
  group: Commit and pull request
  starter: false
  since: 1.0.0
  stage: stable
  prompt_budget: 0
  walkthrough: docs/from-commit.md
  purpose: Merge one named pull request with a merge commit.
  in_depth:
  - Merge one named pull request only when that turn asks; always a merge commit; no squash, rebase, or
    policy bypass. After the completed re-read, two parents are confirmed with `git rev-list` (commits
    API if git cannot see the commit). Does not run `/crav1-review-pr`. Stops when a required host check
    is red.
  - '1.64.0: after a confirmed merge, says `<n> of <m> branches of <slug> now merged into <target>` per spec. No file edits.'
  - '1.66.0: a branch that is behind the base or has conflicts gets one line: merge the base into the branch, push, then ask to merge again. Never a rebase.'
  - '1.68.0: after a sub-branch merge, says `<n> of <m> sub-branches merged into <spec branch>` and any `left behind` branch; a reverted branch shows `merged, reverted on <base> (<sha>)`, report only.'
  - '1.69.0: the `Promotion:` line after the after-merge line, with the optional `pipeline runs` check.'
  - '1.97.0: before the merge it reads the merge-readiness line (`Ready:`) of the PR note''s shared PR record. `Ready: no` stops the merge and lists the reasons, unless the turn says `anyway`; `anyway` never skips a required check, policy or review. No line: it goes on and names `/crav1-pr-status`. After the merge it sets `State: merged` and `Ready: merged` in the record instead of a `State on <date>` line.'
  choice_words:
  - question: Also check the latest pipeline runs?
    words:
    - word: "pipeline runs"
      means: "check the latest successful Azure DevOps runs behind the Promotion line (read-only)"
  - question: The PR record says not ready (1.97.0)
    words:
    - word: "anyway"
      means: "merge although the record's `Ready:` line says no; host checks, policies and reviews still apply"
  use_when: This turn asks to merge a named pull request
  table:
    reads: That named pull request
    writes: A merge commit on the host, a fast-forward of the local default branch when the tree is
      clean, and the PR note with its PR record in the specs repo
  reads: Reads one named pull request, and the merge-readiness line of its PR record in the specs repo.
  writes: Writes a merge commit on the host, and fast-forwards local default when the tree is clean after
    a confirmed two-parent merge. Then writes or reuses the PR note in the specs repo's `docs/notes/YYYY-MM/`, with its PR record's `State` and `Ready` lines set to merged (not committed).
  leaves_alone: Leaves squash, rebase, branch deletion, and work-item links alone.
  exceptions: a required red host check stops it, and so does a PR record whose `Ready` line says no, unless the turn says `anyway`. It does not run `/crav1-review-pr` or `/crav1-pr-status`.
  called_by: Called by the user.
  runs_by_itself: Calls no skill.
  you_run_next:
  - /crav1-refresh-system-notes after an outside pull request merges
  - /crav1-finalize-commit
