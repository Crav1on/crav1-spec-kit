    A code change: Writes quotes of what belongs into the matching `spec.md` files, and the same glossary
    gap as match-dump. When the read is a whole repo, sets that repo''s `Synced at` line in `repos.md` and touches only
    those repos. When the read is one slice, leaves the repos.md Synced at lines alone and writes or updates `Synced at:
    <repo> <branch>@<short sha>, <date>` on that slice''s `spec.md`. After a kept quote, compares it with
    `docs/research/*.md` and `## Research findings` on the specs it touches, including notes those findings
    link to, following `crav1-add-to-spec` `references/research-stale.md`. A clear contradiction or an
    answered open question is marked stale only after the user says yes. An unclear case is not marked.
    It may draft a revisit request for the note''s owner. It does not send it. A meeting: When a kept
    addition imports a source, writes `docs/sources/YYYY-MM-DD-<slug>/` following `crav1-add-to-spec`
    `references/sources.md`, and does not write the spec. Writes one full note `docs/notes/YYYY-MM/YYYY-MM-DD-<slug>.md` for the whole input.
    The same mail or meeting again is not imported twice.
    That check may write the transfer data policy after a yes. Cursor: `.cursor/rules/crav1-transfer-data-policy.mdc`.
    Claude Code project: `.claude/rules/crav1-transfer-data-policy.md`. It never writes a secrets choice
    into that file. For a mail, it lists each embedded image, inline or attached. It recommends convert
    to text when the image is a diagram, a table, or text that can be reproduced exactly, and compress
    otherwise. It asks once before the source folder is written. Auto-accept applies to those recommendations
    only when the transfer data policy clearly covers them.'
  leaves_alone: 'A fact: Leaves `plan.md`, `tasks.md`, and a missing `glossary.md` alone. Does not commit.
    A dump: Leaves leftovers, `plan.md`, `tasks.md`, and other landscape files alone unless the user picks
    apply. Does not commit. A code change: Leaves leftovers, application code, `plan.md`, `tasks.md`,
    and other landscape files alone unless the user picks apply. Does not commit. A meeting: Leaves `docs/system/`,
    specs, marks, and dismissals alone. Does not commit.'
  exceptions: 'A fact: creates no slug and no `docs/system/`. Every input is one full note in `docs/notes/YYYY-MM/`
    (source date, `Imported:` date); never absorbed, `used_by` grows; no Note choice; indexes generated. The research question is not the landscape apply question. The read-environment
    and suggest-tests-for-code handoffs ask once at the end of the run, not per item, whether to run `/crav1-refresh-system-notes`,
    and do not run it. The ado-sync handoffs do not ask. The meeting handoff runs this research
    check. It does not run it a second time. A dump: creates no slug and seeds no `docs/system/`. The whole dump is one full note. The research question is not the landscape apply question. A code change: creates no slug,
    seeds no `docs/system/`, and does not watch the repo. The research question is not the landscape apply
    question. A skill that writes `docs/research/` follows the clear section of that same file. That check
    does not ask the user. A meeting: no input stops and asks. The kind and the date come from the input,
    one of each for the run. An unclear kind, or no date, is one question. The whole input is one full note; there is no Note choice. Dismiss is this run only and is not stored. Dismiss stays
    for a greeting, scheduling, and thanks. A kept new feature or bug only names the next command. A build-state
    line on a matched item is informational. It is not quote text. It does not start Specify, Plan, or
    Build. It is not a starter option.'
  called_by: Called by the user, by `/crav1-read-environment` for a confirmed Match section, by `/crav1-suggest-tests-for-code`
    for one kept or dismissed suggestion, by `/crav1-add-to-spec` for one kept addition, by `/crav1-ado-sync`
    for a preview change, and by `/crav1-ado-sync` for one kept change or one answer.
  runs_by_itself: 'A fact: Calls no skill. A dump: Calls no skill. A code change: Calls no skill. A meeting:
    Calls `/crav1-add-to-spec` for one kept addition. That handoff runs the research check in `crav1-add-to-spec`
    `references/research-stale.md`. This skill does not run it a second time and does not write the stale
    block. A clear answer to a spec open question is handed to `/crav1-add-to-spec` as an answer link
    without a keep question, with the asked marks the input shows, following `crav1-add-to-spec` `references/open-questions.md`.
    An unclear or partial answer is shown as a possible answer and the question stays open.'
  you_run_next:
  - /crav1-tighten-spec
  - /crav1-finalize-commit
