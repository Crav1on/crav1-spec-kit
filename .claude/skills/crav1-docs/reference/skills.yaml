- name: crav1-finalize-commit
  choice_words:
  - question: Commit or message
    words:
    - word: "commit"
      means: "the same as commit now (1.76.1)"
    - word: "message only"
      means: "draft and show, no git commit; the same as copy (1.83.0)"
    - word: "commit now"
      means: "draft, show, then commit with no choice question (never pushes)"
  - question: Base branch
    words:
    - word: "new branch"
      means: "code staged on a base branch: create feat/<slug> from the into branch and commit there (1.99.0)"
  - question: Pull
    words:
    - word: "pull"
      means: "fetch, then the pull path or the nothing-lost check, with no commit first (1.81.0)"
  - question: Style
    words:
    - word: "crav1"
      means: "CRAV1 style, this commit only"
    - word: "git log"
      means: "match git log, this commit only"
  - question: Trailer hook
    words:
    - word: "strip trailers"
      means: "add the shared .githooks/commit-msg hook that strips known tool trailers, and save yes (1.90.0); on commit, the hook and its project rule go into that commit (1.90.6)"
    - word: "keep trailers"
      means: "no hook; save no so it is not asked again (1.90.0)"
  lane: cross-cutting
  group: Commit and pull request
  starter: false
  since: 1.0.0
  stage: stable
  prompt_budget: 3
  walkthrough: docs/from-commit.md
  purpose: Draft the commit message, then commit, copy, change, or stop.
  in_depth:
  - '1.99.0: never commits implementation code on a base branch, even with `commit now`; the prompt becomes `Commit on a work branch?` (create `feat/<slug>` from the into branch and commit, an existing branch, another name, stop). Spec and doc commits on a base are unchanged.'
  - '**`/crav1-finalize-commit`** always drafts first, then offers commit, copy, change, or stop (1.83.0;
    there is no opening question). When no style rule is saved, it drafts in the recommended style and
    asks CRAV1 style or git log in the same prompt as those choices (1.89.0), at most once per run (1.90.5). `message only` drafts with
    no commit, the same as copy, and a headless run with no choice word ends as copy. It replaces draft-commit-message; its rules are kept as a branch.'
  - 'Only write the message (was `/crav1-draft-commit-message`): Paste-ready Summary/Description for any
    git client; CRAV1 style or live git log, once or onward (deletable rule); does not commit unless they
    ask. Optional Azure Boards mention from `docs/specs/<slug>/work-item.md` is the last description line.'
  - 'Commit (was `/crav1-finalize-commit`): Same draft, then **commit first**, then copy for your git
    client, change (edit or rewrite), or stop (no push). Keeps that mention through the HEAD check and the strip
    of the known tool trailers it did not write (the list in `references/tool-trailers.md`: Cursor, Claude Code,
    Copilot, Aider, Codex, Gemini, Jules, Devin and more); `Signed-off-by` and a real person''s `Co-authored-by` stay (1.94.0).'
  - 'Trailer hook (1.90.0): asked once per repo in the same prompt, "Strip tool trailers on every commit
    for this repo?". `strip trailers` writes a committed `.githooks/commit-msg` (POSIX sh) that removes only
    the known tool trailers in `references/tool-trailers.md`, runs `git config core.hooksPath .githooks`,
    and saves the answer in a `trailer-hook` rule. `Signed-off-by` and human `Co-authored-by` lines stay. A teammate whose
    repo has the hook but not the config gets the config line on their first run, with no question.
    `keep trailers` saves no and never asks again.'
