  maintainer_note:
  - This page is generated (1.107.0). Lanes come from each skill's and subagent's `lane`, and the text from
    the `routing` block, in [`docs/reference/skills.yaml`](reference/skills.yaml). Edit that file, then run
    `python3 scripts/gen-skill-docs.py`; CI fails when this page is stale. Notify your process orchestrator
    or guild lead, if you have one, with the routing diff.
  recommended_option:
  - 'Every question with options that has a recommendation lists that option first and ends its label
    with ` (Recommended)`. The question text does not also say `Recommendation: X`. This covers the opening
    questions of `/crav1-build-tasks`, `/crav1-fix-build-gaps`, `/crav1-add-to-spec`, `/crav1-ado-sync`,
    `/crav1-existing-to-specs`, `/crav1-finalize-commit`, and `/crav1-show-or-ask-open-questions` (marked
    only when the message or files make one option the better fit), keep, leave, dismiss, or note in `/crav1-add-to-spec`,
    keep or redact and the image options in the imported-sources check, the suggested patch letter in
    `/crav1-tighten-spec` and `/crav1-tighten-plan`, the branch choice in `/crav1-create-feature-branch`,
    and the task type in `/crav1-ado-sync`. The shared rule is in `crav1.mdc` (and `CLAUDE.md`).'
  choice_words_intro: The merged skills take exact choice words instead of `--flags`. A word in the invocation
    takes that choice without asking, for a person, a bot, or a headless run. A headless or bot run with
    no word stops and names the valid words; it does not guess. Runners should always pass the word.
  choice_words_example: 'Example: `/crav1-ado-sync push tasks`, `/crav1-existing-to-specs repos and bundle
    spec per feature`.'
