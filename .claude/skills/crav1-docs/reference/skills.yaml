    @docs/specs/<slug>/


    <the new information, in your words>


    Add this to that spec. Do not write code. Do not plan.'
- name: crav1-plan-from-spec
  lane: plan
  group: Plan
  starter: false
  since: 1.0.0
  stage: stable
  prompt_budget: 1
  walkthrough: docs/from-spec-to-plan.md
  purpose: Turn an accepted spec into a file-level plan.md and independently testable tasks.md.
  in_depth:
  - File-level `plan.md` and `tasks.md`; each verify note names the checks before code; names a linter
    or checker when the repo has one, and stops before Build when it does not; refuses to code and does
    not install a linter. When the spec is partial or `## In the code` names paths, reads that repo and
    branch and chooses finish the gap, add a verify test, or leave it before any task. A piece that already
    matches v0 is not a choice.
  - '1.64.0: Built pieces reads every work branch of the spec without checkout (and `../<repo>` for another repo), labels pieces `only on <branch>, not merged`, and ends a task with `(branch: …)` when its piece lives on one branch.'
  - '1.68.0: a task may name a sub-branch of the spec branch, `(branch: feat/orders-capacity-t3)`.'
  - '1.87.0: each kept-open question that does not block the demo becomes its own entry under `## Risks`, "do not implement until resolved", without asking. It picks any `Blocks: T#` itself.'
  use_when: Spec is accepted
  table:
    reads: Spec, diagrams, ADRs; the named repo and branch when the slice is partial
    writes: '`plan.md`, `tasks.md`, and matching OpenSpec export files when those already exist'
  reads: Reads the accepted spec, diagrams, ADRs, exports, kept security findings already written, and,
    when the spec is partial or `## In the code` names paths, that same committed repo and branch before
    any task is written.
  writes: Writes `plan.md` and `tasks.md`, and matching OpenSpec export files when those already exist.
    A built piece that already matches v0 is marked already there and gets no rebuild task. A piece the
    user leaves gets one line in the plan and no task. Lists each kept-open question under Risks without
    asking, and stale research findings under Risks. That does not block the plan.
  leaves_alone: Leaves `spec.md`, application code, and any linter install alone.
  exceptions: when `## Linter` says this repo has no linter for the code the tasks will touch, it stops
    before Build until the user chooses. A line under `## Dismissed test suggestions` is not a task. A
    kept test suggestion that is already an acceptance line maps to a task. A gap or a disagreement is
    finish, add a verify test, or leave before any task exists. A later run does not turn a left piece
    into work unless the user says so. Stale research does not fail the gate.
  called_by: Called by the user.
  runs_by_itself: Calls no skill.
  you_run_next:
